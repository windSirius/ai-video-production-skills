name: 流程缺陷
description: 报告可复现的 Skill、脚本或生产流程问题
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      options:
        - zhangyanfa-video-production（总控/目录/审批）
        - game-lore-script（研究/稿件）
        - game-footage-ingest-index（素材/镜头库）
        - voxcpm-batch-dubbing（配音）
        - subtitle-timeline（字幕/帧时钟）
        - zhangyanfa-track-design（A/B/C 配画）
        - zhangyanfa-score-and-mix（BGM/混音）
        - zhangyanfa-track-renderer（渲染/QA）
        - zhangyanfa-cover-production（封面）
        - jianying-dubbing-postproduction（兼容）
        - jianying-sentence-visual-matching（兼容）
        - jianying-zhangyanfa-style（兼容）
        - jianying-acceptance-polish（兼容）
        - top-tier-narrative-editing（可选学习模块）
        - 仓库安装/文档/依赖/检查工具/CI
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与仓库版本
      description: 提供提交 SHA、系统、Python/FFmpeg 版本、复制或软链接安装方式；不要贴用户名路径或完整环境变量。
      placeholder: "commit: ...; macOS/Linux: ...; Python: ...; FFmpeg: ..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与复现步骤
      description: 请使用脱敏信息，不要上传私人素材、声音或凭据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证证据
      description: 可附脱敏日志、检查 ID、doctor/check 输出。说明是 CURRENT.json 新流程还是 run_manifest.json 旧工程；技术 PASS 不代表已人工审批。
