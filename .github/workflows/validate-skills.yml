name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media probe tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Skill packages
        run: python tools/validate_skills.py
      - name: Compile Python sources
        run: python -m compileall -q skills
      - name: Check script entrypoints
        shell: bash
        run: |
          while IFS= read -r script; do
            python "$script" --help >/dev/null
          done < <(rg --files skills -g '*.py' | sort)
      - name: Run module regression tests
        shell: bash
        run: |
          for skill in skills/*; do
            for test_dir in "$skill/scripts" "$skill/tests"; do
              if compgen -G "$test_dir/test_*.py" > /dev/null; then
                python -m unittest discover -s "$test_dir" -p 'test_*.py'
              fi
            done
          done
